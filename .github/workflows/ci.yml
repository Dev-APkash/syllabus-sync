# Runs on every push and pull request: lint, type check, unit tests and a production build.
# Needs no secrets, so it can never leak one.
name: CI

on:
  # Pushes to the main branches only; other branches (e.g. Dependabot's) are tested once, by their pull request.
  push:
    branches: [main, selfhost]
  pull_request:

# Least privilege: this workflow can read the code and nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
