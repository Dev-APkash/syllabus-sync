# Runs on every push and pull request: lint, type check, unit tests and a production build.
# Needs no secrets, so it can never leak one.
name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow can read the code and nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
