# Syllabus Sync, self-hosted: the app plus the parts of Supabase it uses.
#
#   First run:   bash setup.sh             (creates .env with fresh secrets)
#   Start:       docker compose up -d --build
#   Stop:        docker compose down
#   Logs:        docker compose logs -f app
#   Admin UI:    docker compose --profile studio up -d   (see README.md)
#
# Based on Supabase's official self-hosting setup (https://github.com/supabase/supabase/tree/master/docker,
# Apache-2.0), trimmed to the services this app needs: Postgres, Auth, the REST API, Storage and the
# API gateway. Realtime, Edge Functions, analytics, the pooler and image resizing are left out.
#
# Traffic flow:  browser → Caddy (one address) → /auth/v1, /rest/v1, /storage/v1 → api-gw (Envoy) → Supabase
#                                              → everything else → app (Next.js)

name: syllabus-sync

services:
  # ---------- The front door: the only container with a published port ----------
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      # 127.0.0.1 = only this VM can reach it; Tailscale Serve publishes it to your tailnet over HTTPS.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      api-gw:
        condition: service_healthy

  # ---------- Syllabus Sync itself ----------
  app:
    # APP_IMAGE empty: build from this folder's source (`docker compose up -d --build`).
    # APP_IMAGE=ghcr.io/<owner>/syllabus-sync:<version>: use a published image
    # (`docker compose pull app && docker compose up -d`); nothing is built.
    image: ${APP_IMAGE:-syllabus-sync-app:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      api-gw:
        condition: service_healthy
    environment:
      # Read when the container starts (one image fits every install). The browser reaches
      # Supabase through the same address as the app, so no separate Supabase address is needed.
      SITE_URL: ${SITE_URL:?Run setup.sh first}
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      # Server code talks to Supabase directly inside Docker.
      SUPABASE_INTERNAL_URL: http://api-gw:8000
      SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      MAX_EXTRACTIONS_PER_DAY: ${MAX_EXTRACTIONS_PER_DAY:-10}
      EXTRACTION_ENABLED: ${EXTRACTION_ENABLED:-true}
      # Encrypts linked Canvas tokens (64 hex characters). Empty = Canvas linking is switched off.
      CANVAS_TOKEN_KEY: ${CANVAS_TOKEN_KEY:-}

  # ---------- Applies supabase/migrations/*.sql once each, then exits ----------
  migrate:
    image: supabase/postgres:17.6.1.136
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      # Auth and Storage create the auth.users and storage.* tables our migrations build on.
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../supabase/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/bash", "/migrate.sh"]

  # ---------- Supabase: API gateway (Envoy, configured exactly as upstream) ----------
  api-gw:
    image: envoyproxy/envoy:v1.39.1
    restart: unless-stopped
    networks:
      default:
        aliases:
          - envoy
          - kong
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./supabase/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./supabase/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./supabase/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./supabase/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Left empty: this install uses the classic (legacy) API keys.
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      SUPABASE_PUBLIC_URL: ${SITE_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

  # ---------- Supabase: Auth (sign-up, login) ----------
  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/**
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SITE_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # true = no confirmation email needed (fine for a personal install with no email server).
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      # Matches MIN_PASSWORD_LENGTH in lib/constants.ts (the form check alone can be bypassed).
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      # Optional email server (needed for password-reset emails).
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Syllabus Sync}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  # ---------- Supabase: REST API over the database (PostgREST) ----------
  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    command: ["postgrest"]

  # ---------- Supabase: file storage (uploaded PDFs live in ./volumes/storage) ----------
  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      # First start runs storage's own database migrations: over a minute on slow (HDD) servers
      start_period: 120s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SITE_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - ./volumes/storage:/var/lib/storage:z

  # ---------- Supabase: Postgres (data lives in ./volumes/db/data) ----------
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      # First-start scripts from upstream, unchanged (roles.sql needs the role webhooks.sql creates).
      - ./supabase/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.sh first}
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  # ---------- Optional admin dashboard: docker compose --profile studio up -d ----------
  studio:
    profiles: ["studio"]
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    ports:
      # Only reachable from the VM itself; open it from your laptop through an SSH tunnel (README.md).
      - "127.0.0.1:${STUDIO_PORT:-3001}:3000"
    depends_on:
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,graphql_public
      DEFAULT_ORGANIZATION_NAME: Syllabus Sync
      DEFAULT_PROJECT_NAME: Syllabus Sync
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SITE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  meta:
    profiles: ["studio"]
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

volumes:
  db-config:
  caddy_data:
  caddy_config:
